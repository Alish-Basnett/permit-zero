name: BorderControl
options:
  bundleIdPrefix: com.yourname.bordercontrol
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  BorderControl:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Border Control
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.bordercontrol
        PRODUCT_NAME: BorderControl
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
